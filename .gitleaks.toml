title = "402 Index gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Documented placeholder admin bearer token in API examples"
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^src/views/api-docs\.js$''',
]
regexes = [
  '''Authorization: Bearer YOUR_ADMIN_SECRET''',
]

[[allowlists]]
description = "Deterministic dummy credentials used by protocol tests and captured fixtures"
targetRules = ["generic-api-key", "jwt"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^test/.*\.test\.js$''',
  '''^reports/l402-discovery-2026-03-05\.json$''',
]
regexes = [
  '''rawToken = 'a1b2c3d4e5f67890abcdef1234567890' ''',
  '''storedToken = '[a-f0-9]{64}' ''',
  '''NOSTR_PRIVATE_KEY = '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' ''',
  '''L402 (token|macaroon)="AgELYmVuY2FybWFu''',
  '''const jwt = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9\.eyJwYXltZW50X2hhc2giOiJjZGIzMjk3OTg2ZGYyZTk3MjYzMGY0M2FkZDQ1MTkxZjU4ZjE4ZTM3OTcwM2FmZDZkZjNkMWFiMDk3NGJlNDQzIn0\.Vmh_HonFE-XTeUPamsO8B3EptcoQxzC-FEojRWOF7EA' ''',
  '''"name": "WoT Scoring API: AI trust graph visualization"''',
]
